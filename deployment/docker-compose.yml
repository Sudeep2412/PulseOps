services:
  pulseops-app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: ${REGISTRY:-512888109658.dkr.ecr.us-east-1.amazonaws.com}/pulseops-app:${IMAGE_TAG:-latest}
    container_name: pulseops-core-app
    restart: unless-stopped
    ports:
      # Bound to localhost interface for internal validation (no public exposure)
      - "127.0.0.1:8000:8000"
    volumes:
      - /home/ubuntu/pulseops-deployments:/app/deployments:ro
    environment:
      - APP_NAME=PulseOps
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - ENVIRONMENT=production
      - CURRENT_COMMIT_SHA=${IMAGE_TAG:-latest}
      - DEPLOYMENTS_HISTORY_FILE=/app/deployments/deployments_history.jsonl
      - INCIDENTS_HISTORY_FILE=/app/deployments/incident_history.jsonl
      - LOG_LEVEL=INFO
      - DEBUG=false
      - SECRET_KEY=pulseops-production-secret-demo-token-change-in-vault
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pulseops-net

networks:
  pulseops-net:
    name: pulseops-network
    driver: bridge
