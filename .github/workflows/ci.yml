name: PulseOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Application Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: application/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd application/backend
          PYTHONPATH=. pytest -v --cov=. --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: false
          tags: pulseops-app:ci
          load: true

      - name: Verify Container Non-Root User & Image
        run: |
          docker run --rm pulseops-app:ci id
          docker run --rm pulseops-app:ci whoami

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r application/backend/requirements.txt

  ecr-publish:
    name: Publish Docker Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: [test, docker-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512888109658:role/github-actions-pulseops-ecr
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/pulseops-app:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/pulseops-app:latest

      - name: Verify Published ECR Image Tags
        run: |
          echo "Verifying published image tags in Amazon ECR..."
          aws ecr describe-images \
            --repository-name pulseops-app \
            --image-ids imageTag=${{ github.sha }} imageTag=latest \
            --region us-east-1 \
            --query 'imageDetails[*].[imageTags, imagePushedAt, imageDigest]' \
            --output table
