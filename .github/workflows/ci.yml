name: PulseOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Application Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: application/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd application/backend
          PYTHONPATH=. pytest -v --cov=. --cov-report=term-missing --cov-fail-under=85

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: false
          tags: pulseops-app:ci
          load: true

      - name: Verify Container Non-Root User & Image
        run: |
          docker run --rm pulseops-app:ci id
          docker run --rm pulseops-app:ci whoami

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r application/backend/requirements.txt
