name: PulseOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          pytest application/backend/tests -v --cov=application/backend --cov-report=term-missing --cov-fail-under=80

  security-sast:
    name: SAST, Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r application/backend/requirements.txt

      - name: Validate Observability & SRE Configuration, Dashboards & Rules
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config --quiet
          bash -n monitoring/manage_monitoring.sh
          bash -n deployment/validate_sre.sh
          python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('monitoring/grafana/dashboards/*.json')]; print('Dashboards JSON valid')"
          docker run --rm -v ${{ github.workspace }}/monitoring/prometheus:/etc/prometheus --entrypoint promtool prom/prometheus:v3.0.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v ${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules --entrypoint promtool prom/prometheus:v3.0.1 check rules /etc/prometheus/rules/pulseops_alerts.yml
          docker run --rm -v ${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules --entrypoint promtool prom/prometheus:v3.0.1 check rules /etc/prometheus/rules/pulseops_slo_rules.yml
          docker run --rm -v ${{ github.workspace }}/monitoring/prometheus/rules:/etc/prometheus/rules --entrypoint promtool prom/prometheus:v3.0.1 check rules /etc/prometheus/rules/pulseops_error_budget.yml
          docker run --rm -v ${{ github.workspace }}/monitoring/prometheus:/etc/prometheus --entrypoint promtool prom/prometheus:v3.0.1 test rules /etc/prometheus/tests/pulseops_slo_test.yml
          docker run --rm -v ${{ github.workspace }}/monitoring/alertmanager:/etc/alertmanager --entrypoint amtool prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml

  container-build:
    name: Container Build & Image Security Scan
    runs-on: ubuntu-latest
    needs: [test, security-sast]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: pulseops-app:${{ github.sha }}
          load: true

      - name: Verify Container Non-Root Execution
        run: |
          USER_ID=$(docker run --rm pulseops-app:${{ github.sha }} id -u)
          echo "Container runtime user ID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container is configured to run as root (UID 0)! Non-root user required." >&2
            exit 1
          fi

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulseops-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  ecr-publish:
    name: OIDC Auth & ECR Image Publish
    runs-on: ubuntu-latest
    needs: [container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512888109658:role/github-actions-pulseops-ecr
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            512888109658.dkr.ecr.us-east-1.amazonaws.com/pulseops-app:${{ github.sha }}
            512888109658.dkr.ecr.us-east-1.amazonaws.com/pulseops-app:latest

      - name: Verify Pushed Image Digest in ECR
        run: |
          aws ecr describe-images \
            --repository-name pulseops-app \
            --image-ids imageTag=${{ github.sha }} \
            --region us-east-1 \
            --query "imageDetails[*].[imageDigest, imagePushedAt, join(',', imageTags)]" \
            --output table

  ec2-deploy:
    name: Continuous Deployment to AWS EC2 via SSM
    runs-on: ubuntu-latest
    needs: [ecr-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512888109658:role/github-actions-pulseops-ecr
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - name: Trigger Remote Deployment via AWS SSM Run Command
        id: ssm-deploy
        run: |
          echo "Dispatching deployment command to EC2 instance i-05e6553f01eb76141..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-05e6553f01eb76141" \
            --document-name "AWS-RunShellScript" \
            --comment "PulseOps CD Deployment for commit ${{ github.sha }}" \
            --parameters "commands=[\"/home/ubuntu/PulseOps/deployment/sync_and_deploy.sh ${{ github.sha }}\"]" \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command dispatched. ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Monitor SSM Deployment Execution & Stream Logs
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          echo "Monitoring SSM Command $COMMAND_ID for completion (up to 300 seconds)..."
          MAX_ATTEMPTS=60
          INTERVAL_SECONDS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-05e6553f01eb76141" \
              --region us-east-1 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[Attempt $attempt/$MAX_ATTEMPTS] SSM Execution Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "========================================================================"
              echo "SSM Deployment Execution: SUCCESS"
              echo "========================================================================"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-05e6553f01eb76141" \
                --region us-east-1 \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "DeliveryTimedOut" ] || \
                 [ "$STATUS" = "ExecutionTimedOut" ] || [ "$STATUS" = "Undeliverable" ] || \
                 [ "$STATUS" = "Terminated" ]; then
              echo "========================================================================"
              echo "SSM Deployment Execution: FAILED (Terminal Status: $STATUS)"
              echo "========================================================================"
              echo "--- STDOUT ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-05e6553f01eb76141" \
                --region us-east-1 \
                --query "StandardOutputContent" \
                --output text || true
              echo "--- STDERR ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-05e6553f01eb76141" \
                --region us-east-1 \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi

            sleep "$INTERVAL_SECONDS"
          done

          echo "========================================================================"
          echo "WARNING: GitHub Actions runner polling timeout reached (300 seconds)."
          echo "SSM Command $COMMAND_ID may still be in progress on EC2."
          echo "Fetching latest available log output before exiting..."
          echo "========================================================================"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-05e6553f01eb76141" \
            --region us-east-1 \
            --query "StandardOutputContent" \
            --output text || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-05e6553f01eb76141" \
            --region us-east-1 \
            --query "StandardErrorContent" \
            --output text || true
          exit 1