global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: 'production'
    cluster: 'pulseops-aws-us-east-1'
    instance_id: 'i-05e6553f01eb76141'

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'pulseops-app'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['pulseops-app:8000']
        labels:
          service: 'pulseops-core-engine'
          layer: 'application'

  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          layer: 'infrastructure'

  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          layer: 'container'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          layer: 'observability'

  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          layer: 'observability'
